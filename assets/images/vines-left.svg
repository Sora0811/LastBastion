<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="260" height="340" role="img" aria-label="攀牆藤蔓與木盆">
  <defs>
    <g id="leaf">
      <path d="M0 0C7-9 20-11 28-3C20 6 6 7 0 0Z"/>
    </g>
    <g id="bloom">
      <g fill="#D4A469" opacity=".92">
        <circle cx="0" cy="-6.4" r="3.4"/>
        <circle cx="6" cy="-2" r="3.4"/>
        <circle cx="3.8" cy="5.2" r="3.4"/>
        <circle cx="-3.8" cy="5.2" r="3.4"/>
        <circle cx="-6" cy="-2" r="3.4"/>
      </g>
      <circle r="2.6" fill="#E9E0D0"/>
    </g>
  </defs>

  <g class="vine">
    <!-- 木盆 -->
    <ellipse cx="108" cy="279" rx="56" ry="6.5" fill="#3A3026" opacity=".85"/>
    <path d="M48 292h120l-10 46H58Z" fill="#89664B" stroke="#5A422F" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="42" y="278" width="132" height="15" rx="3" fill="#A57F5F" stroke="#5A422F" stroke-width="1.6"/>
    <g stroke="#5A422F" stroke-width="1.2" opacity=".38">
      <path d="M70 300v32M96 300v32M122 300v32M148 300v32"/>
    </g>
    <path d="M58 292h100" stroke="#F4EDE0" stroke-width="1" opacity=".18"/>

    <!-- 草葉 -->
    <g fill="none" stroke="#78866B" stroke-width="2.2" stroke-linecap="round" opacity=".9">
      <path d="M84 276c-6-12-16-18-26-20"/>
      <path d="M94 276c-2-14-8-24-16-30"/>
      <path d="M118 276c4-13 12-21 22-24"/>
      <path d="M130 277c7-10 17-15 27-15"/>
    </g>

    <!-- 主莖 -->
    <g fill="none" stroke="#6E7C63" stroke-width="3.2" stroke-linecap="round">
      <path d="M100 280C74 258 112 234 90 206C70 180 104 158 88 130C74 106 96 82 82 52"/>
    </g>

    <!-- 分枝 -->
    <g fill="none" stroke="#77856C" stroke-width="2.4" stroke-linecap="round">
      <path d="M90 206C64 200 50 184 46 162"/>
      <path d="M88 130C114 124 128 106 132 84"/>
      <path d="M100 250C124 244 138 228 142 210"/>
      <path d="M82 52C104 46 116 32 120 14"/>
