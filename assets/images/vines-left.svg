    <!-- 捲鬚 -->
    <g fill="none" stroke="#84927A" stroke-width="1.4" stroke-linecap="round" opacity=".75">
      <path d="M74 172c-10-2-14 6-8 10s12-2 8-8"/>
      <path d="M104 118c10-4 16 2 12 8s-14 0-10-6"/>
      <path d="M112 240c12-2 18 4 14 10s-16 0-12-7"/>
    </g>

    <!-- 葉片 -->
    <g fill="#78866B">
      <use href="#leaf" transform="translate(100 270) rotate(-150) scale(.95)"/>
      <use href="#leaf" transform="translate(98 252) rotate(-22) scale(.9)"/>
      <use href="#leaf" transform="translate(90 228) rotate(-160) scale(.85)"/>
      <use href="#leaf" transform="translate(86 208) rotate(-18) scale(1)"/>
      <use href="#leaf" transform="translate(78 186) rotate(-168) scale(.82)"/>
      <use href="#leaf" transform="translate(70 166) rotate(-28) scale(.92)"/>
      <use href="#leaf" transform="translate(78 146) rotate(-152) scale(.86)"/>
      <use href="#leaf" transform="translate(92 126) rotate(-12) scale(.96)"/>
      <use href="#leaf" transform="translate(94 106) rotate(-124) scale(.82)"/>
      <use href="#leaf" transform="translate(88 86) rotate(-24) scale(.9)"/>
      <use href="#leaf" transform="translate(76 66) rotate(-166) scale(.8)"/>
      <use href="#leaf" transform="translate(84 46) rotate(-16) scale(.88)"/>
    </g>
    <g fill="#8E9C7E">
      <use href="#leaf" transform="translate(46 162) rotate(186) scale(.86)"/>
      <use href="#leaf" transform="translate(58 172) rotate(150) scale(.7)"/>
      <use href="#leaf" transform="translate(132 84) rotate(-36) scale(.9)"/>
      <use href="#leaf" transform="translate(120 96) rotate(-82) scale(.72)"/>
      <use href="#leaf" transform="translate(142 210) rotate(18) scale(.82)"/>
      <use href="#leaf" transform="translate(132 222) rotate(-52) scale(.7)"/>
      <use href="#leaf" transform="translate(120 14) rotate(-56) scale(.8)"/>
    </g>
    <g fill="#65725A">
      <use href="#leaf" transform="translate(96 262) rotate(28) scale(.72)"/>
      <use href="#leaf" transform="translate(82 198) rotate(-96) scale(.66)"/>
      <use href="#leaf" transform="translate(86 118) rotate(-64) scale(.62)"/>
    </g>

    <!-- 花 -->
    <use href="#bloom" transform="translate(142 210) scale(.95)"/>
    <use href="#bloom" transform="translate(120 14) scale(.8)"/>
    <circle cx="46" cy="162" r="3.2" fill="#E9E0D0" opacity=".85"/>
    <circle cx="52" cy="156" r="2.2" fill="#D4A469" opacity=".9"/>
    <circle cx="58" cy="172" r="2" fill="#D4A469" opacity=".8"/>
  </g>
</svg>
