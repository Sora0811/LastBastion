<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAST BASTION 最後堡壘</title>
  <meta name="description" content="Last Bastion（最後堡壘）：以地下堡壘的空間結構作為導覽的個人創作展示網站，收藏原創角色、開發筆記與互動演示。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="LAST BASTION 最後堡壘">
  <meta property="og:description" content="以地下堡壘的空間結構作為導覽：樓梯是樓層，走廊是同層房間。原創角色、開發筆記與互動演示。">
  <meta property="og:locale" content="zh_TW">
  <meta name="theme-color" content="#34332F">
  <link rel="icon" href="assets/images/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/fortress.css">
  <link rel="stylesheet" href="assets/css/rooms.css">
</head>
<body>
  <a class="skip-link" href="#room" data-skip-link>跳至主要內容</a>

  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-stairs" viewBox="0 0 24 24">
      <path d="M3.5 20.5h4v-4h4v-4h4v-4h4v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-corridor" viewBox="0 0 24 24">
      <path d="M2 17h5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.6 2.2"/>
      <path d="M7.5 20V8.6a4.6 4.6 0 0 1 9.2 0V20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6 20h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14.3" cy="14" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="M6.5 9.5 12 15l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-frame" viewBox="0 0 24 24">
      <rect x="3.5" y="4.5" width="17" height="15" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M3.5 15.5 8 11l4 4 3-2.6 5.5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>

  <header class="banner">
    <div class="banner__wall" aria-hidden="true"></div>
    <div class="banner__glow" aria-hidden="true"></div>
    <img class="banner__vines banner__vines--left" src="assets/images/vines-left.svg" alt="" aria-hidden="true" width="260" height="340">
    <img class="banner__vines banner__vines--right" src="assets/images/vines-right.svg" alt="" aria-hidden="true" width="260" height="340">
    <div class="banner__sign">
      <p class="sign__en">LAST BASTION</p>
      <span class="sign__divider" aria-hidden="true"></span>
      <p class="sign__zh">最後堡壘</p>
      <p class="sign__sub">個人創作展示 · UNDERGROUND ARCHIVE</p>
    </div>
    <div class="banner__ledge" aria-hidden="true"></div>
  </header>

  <div class="fortress" id="fortress">
    <div class="fortress__veil" data-close-nav aria-hidden="true"></div>

    <aside class="rail" id="site-rail" aria-label="堡壘通道圖">
      <div class="rail__head">
        <span class="rail__title">堡壘通道圖</span>
      </div>
      <div class="rail__legend" aria-hidden="true">
        <span><svg class="glyph" focusable="false"><use href="#icon-stairs"></use></svg>梯 · 樓層</span>
        <span><svg class="glyph" focusable="false"><use href="#icon-corridor"></use></svg>廊 · 同層</span>
      </div>
      <nav class="nav" id="site-nav" aria-label="房間導覽">
        <p class="nav__loading">通道圖載入中…</p>
      </nav>
      <p class="rail__foot"><span class="lamp-dot" aria-hidden="true"></span>照明正常 · v0.2</p>
    </aside>

    <main class="deck" id="deck">
      <div class="deck__bar">
        <button class="rail-toggle" id="rail-toggle" type="button" aria-controls="site-rail" aria-expanded="false">
          <svg aria-hidden="true" focusable="false"><use href="#icon-menu"></use></svg>通道圖
        </button>
        <nav class="crumbs" id="crumbs" aria-label="所在位置"></nav>
        <span class="deck__status"><span class="lamp-dot" aria-hidden="true"></span>連線穩定</span>
      </div>

      <article class="sheet" id="room" tabindex="-1">
        <header class="sheet__head">
          <div class="sheet__tags">
            <span class="chip chip--floor" id="chip-floor">B1</span>
            <span class="chip chip--zone" id="chip-zone">地面層</span>
          </div>
          <h1 class="sheet__title" id="room-title" tabindex="-1">最後堡壘</h1>
          <p class="sheet__lead" id="room-lead">正在照亮通道，準備開啟房間。</p>
        </header>

        <div class="sheet__rule" aria-hidden="true"><span></span></div>

        <div class="sheet__body" id="room-body">
          <div class="skeleton" aria-hidden="true">
            <span class="skeleton__line" style="width: 34%"></span>
            <span class="skeleton__line" style="width: 92%"></span>
            <span class="skeleton__line" style="width: 78%"></span>
            <span class="skeleton__line" style="width: 64%"></span>
          </div>
        </div>

        <footer class="sheet__foot">
          <span id="foot-room">LAST BASTION</span>
          <span>v0.2 · 2026</span>
        </footer>
      </article>

      <p class="deck__foot">LAST BASTION · 內容以 Git 管理，逐間搬入</p>
    </main>
  </div>

  <p class="visually-hidden" id="live" aria-live="polite"></p>

  <noscript>
    <div class="noscript">
      這個網站以 JavaScript 讀取通道圖與房間內容。請開啟 JavaScript 後重新整理，或改用支援 JavaScript 的瀏覽器。
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
