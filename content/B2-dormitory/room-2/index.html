<section class="room-section">
  <h2>排圖方式</h2>
  <p>圖片一律放在 <strong>assets/images/illustrations/</strong>，用相對路徑引用，GitHub Pages 上不會因為子目錄而破圖。小圖建議先壓到 400KB 以下。</p>
  <ul class="plain-list">
    <li>一組系列用一個資料夾，裡面的檔名照展示順序編號。</li>
    <li>每張圖下面留一行說明：標題、年份、媒材。</li>
    <li>有互動版本（例如滑鼠移過換圖）就搬到訓練室當示範。</li>
  </ul>
</section>
