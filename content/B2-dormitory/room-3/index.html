<section class="room-section">
  <h2>寫作格式</h2>
  <p>每篇故事用一個 <strong>&lt;article class="card"&gt;</strong> 或以 <strong>&lt;h2&gt;</strong> 分節，直接在這個檔案往下寫即可。長篇累積多了，再拆成同目錄下的獨立文稿，用相對連結互相引用。</p>
  <ul class="plain-list">
    <li>一段不超過四行，閱讀區最大寬度約 60 字。</li>
    <li>人物名第一次出現時用 <strong>粗體</strong>，之後不再重複標記。</li>
    <li>涉及敏感內容的篇章，標題旁先掛提示。</li>
  </ul>
</section>
